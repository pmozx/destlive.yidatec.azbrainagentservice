      // 首屏前应用已保存的主题，避免暗色模式闪白与主色闪蓝

        if (localStorage.getItem('agent_theme_mode') === 'dark') {
          document.documentElement.classList.add('dark')
        }
        document.documentElement.style.setProperty(
          '--el-color-primary',
          localStorage.getItem('agent_primary_color') || '#8b1e56',

      } catch (error) {
        console.warn('读取本地主题配置失败', error)
      }
