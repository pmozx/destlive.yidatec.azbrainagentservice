# pytest.ini（放在项目根目录）
[pytest]
# 测试文件搜索路径
testpaths = tests

# 测试文件命名规则
python_files = test*.py *_test.py
python_classes = Test*
python_functions = test*

# 默认命令行参数
addopts = -v --tb=short --color=yes

# 异步测试模式：auto 自动识别 async def，无需手动加 @pytest.mark.asyncio
asyncio_mode = auto
# 每个模块共用一个事件循环：asyncpg 连接绑在创建它的循环上，逐用例换循环会踩
# "attached to a different loop"；同时避免 async fixture 的 loop scope 告警
asyncio_default_test_loop_scope = module

# 标记注册（避免警告）
markers =
    slow: 标记为慢速测试
    smoke: 冒烟测试
    integration: 集成测试