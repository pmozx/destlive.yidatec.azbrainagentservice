[project]
name = "service_brain_agent"
version = "0.1.0"
description = "服务大脑智能体应用"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 下限取当前实测稳定版，上界只防破坏性大版本（或次版本行为变更）；
    # 精确版本由 uv.lock 负责复现，不在这里钉 ==，否则安全补丁进不来。
    "aiofiles>=25.1.0,<26",
    "aiomysql[rsa]>=0.3.2,<0.4",
    "aiosqlite>=0.22,<1",
    "apscheduler>=3.11,<4",
    "asyncpg>=0.32,<1",
    "fastapi>=0.162,<1",
    "greenlet>=3.5.6,<4",
    "httpx>=0.28.1,<1",
    "loguru>=0.7.3,<1",
    "rich>=15.0.0,<16",
#    "pgvector>=0.3.6,<0.4",                   # langchain-postgres 约束 <0.4（原手写向量层用 0.5.x）
    "langchain>=1.4,<2",                      # LangChain 1.4 智能体框架（create_agent / langgraph astream）
    "langgraph>=1.2.18,<2",                    # StateGraph 显式编排（文档流水线与问答链路）
    "langchain-openai>=1.7.3,<2",              # ChatOpenAI(DeepSeek 兼容模式) + OpenAIEmbeddings
    "langchain-ollama>=1.1,<2",                # OllamaEmbeddings（EMBEDDING_PROTOCOL=ollama 私有化部署）
    "langchain-text-splitters>=1.1,<2",        # RecursiveCharacterTextSplitter（文档分片）
    "langchain-postgres>=0.0.19,<0.1",          # PGVector 向量库（分片表 + 余弦检索，psycopg v3 驱动）
    "langgraph-checkpoint-postgres>=3.2,<4",    # PostgresSaver（文档流水线断点续跑）
    "pydantic-settings>=2.16,<3",
    "pydantic[email]>=2.14,<3",
    "python-dotenv>=1.2.4,<2",
    "python-multipart>=0.0.32,<1",
    "sqlalchemy>=2.1,<2.2",                    # 2.1 有行为调整，锁次版本；2.2 升级前单独验证
    "typer>=0.27,<1",
    "uvicorn[standard]>=0.54,<1",
    "mineru-open-sdk>=0.2.5,<0.3",
    "boto3>=1.43.120,<2",                      # 补丁版交给 lock，不钉死 patch 以免每次发布都要改
    "alembic>=1.20,<2",
]

[tool.uv]
default-groups = ["dev"]     # 本地 uv sync 含 dev；生产 pip -r requirements.txt 不含 pytest/ruff/fakeredis
python-install-mirror = "https://registry.npmmirror.com/-/binary/python-build-standalone/"


[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
#[[tool.uv.index]]
#name = "uv-agentsmirror"
#url = "https://uv.agentsmirror.com/pypi/simple"
#[[tool.uv.index]]
#name = "tuna"
#url = "https://pypi.mirrors.ustc.edu.cn/simple/"

#[tool.pytest.ini_options]
#pythonpath = ["."]
#testpaths = ["tests"]
#python_files = ["test*.py"]

[dependency-groups]
dev = [
#    "fakeredis>=2.21.0,<3",   # 测试：内存 Redis，配合 TESTING
    "pytest==9.0.2",
    "pytest-asyncio>=0.24.0",  # 异步测试支持
    "ruff==0.14.13",          # 代码检查/格式化
]
