[alembic]
# Migration script directory (kept under app/ so it ships with the package).
# file_template: date-prefixed revision filenames so chronological order is obvious.
# NOTE: keep this file ASCII-only -- Alembic reads it with the OS locale encoding
# (GBK on Windows), non-ASCII comments would break `alembic` before Python starts.
script_location = app/alembic
prepend_sys_path = .

file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = Asia/Shanghai

# Connection URL is intentionally empty: env.py reads app.config.setting.settings
# so migrations always target the same database as the running application.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
