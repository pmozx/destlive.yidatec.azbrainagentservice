# ==============================================================================
# 第三方公共服务编排（PostgreSQL + pgvector、Ollama、llama.cpp rerank）
#
#   与 devops/compose/app.yml 互补：app.yml 只起应用、不编排中间件；本文件把
#   数据库与模型推理服务纳入同一外部共享网络 service-brain-agent，应用按容器名
#   直连，无需依赖对外发布端口：
#     service-brain-postgres  5432   PostgreSQL 17 + pgvector
#     service-brain-ollama    11434  向量化：/api/embed，模型 bge-m3（1024 维）
#     service-brain-rerank    8080   重排序：/v1/rerank，模型 bge-reranker-v2-m3
#
#   为什么 rerank 不用 Ollama：Ollama 只提供 embed 端点，没有 rerank（交叉编码器
#   打分）接口，社区 reranker 模型也注明需 llama.cpp 类运行时；因此重排序交给
#   llama.cpp 的 llama-server --rerank，两者跑的都是本地 GGUF，无需出网推理。
#
#   应用配置仍唯一来源 env/.env.<ENVIRONMENT>：指向自建中间件只需改
#     DATABASE_TYPE=postgres
#     DATABASE_HOST=service-brain-postgres
#     DATABASE_PORT=5432
#     DATABASE_NAME=service_brain_agent
#   口令两边必须一致：本文件 POSTGRES_PASSWORD 与 env/.env.<env> 的
#   DATABASE_PASSWORD 必须是同一个值。取值已按 .env.example 内联到本文件，
#   因此本编排无需 .env 即可 up -d；若希望口令不入库，把 POSTGRES_PASSWORD
#   改回 "${POSTGRES_PASSWORD:?}" 并在同目录 .env 提供实值。
#
#   向量能力：所选镜像自带 pgvector，initdb/00-init.sql 在数据目录首次初始化时
#   执行 CREATE EXTENSION IF NOT EXISTS vector；应用启动时还会幂等补建（配置项
#   VECTOR_AUTO_CREATE），因此数据卷已存在、跳过 initdb 的场景同样可用。
#   bge-m3 输出 1024 维，须与 env/.env.<env> 的 VECTOR_DIM 一致。
#
#   首次启动自动制备模型：ollama-init 拉取 bge-m3，rerank-init 下载 rerank GGUF
#   到 volumes/rerank/models（已存在则跳过）。二者都是一次性容器，失败时单独
#   重跑即可，不影响已就绪的模型服务：
#     docker compose -f devops/common-server/docker-compose.yml up -d ollama-init
#   镜像 + 模型合计约 5GB 磁盘；CPU 推理常驻内存约 3GB，离线小批量场景足够。
#
#   手工执行（本文件已内联全部取值，不需要 .env）：
#     docker network create service-brain-agent   # 共享网络缺失时（部署脚本也会创建）
#     docker compose -f devops/common-server/docker-compose.yml up -d
#
#   数据持久化：宿主机 devops/common-server/volumes/{postgres/data,ollama,rerank/models}
#   （已 gitignore，首次启动自动创建）；postgres 端口发布到所有网卡便于同网段直连，
#   两个模型服务只绑回环（无鉴权，不对外）。
#
#   本编排不入 CI：中间件与模型服务是长寿命有状态服务，由部署机一次性拉起后长期
#   运行，与应用发布解耦（应用发布脚本不会触碰本编排）。
# ==============================================================================
name: service-brain-common

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    container_name: service-brain-postgres
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "yd@123.."
      POSTGRES_DB: "service_brain_agent"
    ports:
      # 应用走内部网络无需发布；这里发布到所有网卡，便于同网段开发机直连
      # （如 env/.env.dev 的 DATABASE_HOST 填本机局域网 IP）；仅本机使用可改为
      # "127.0.0.1:5432:5432"
      - "5432:5432"
    volumes:
      - ./volumes/postgres/data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    # 并行查询与向量索引构建会用到共享内存，默认 64MB 偏小
    shm_size: "256mb"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d service_brain_agent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app

  # 向量化：bge-m3（多语言，1024 维，8K 上下文），走 Ollama 原生 /api/embed
  # 镜像锁版本：Ollama 0.40.x 为当前稳定线，0.40.11 是该线最新补丁（2026-10-24）
  ollama:
    image: ollama/ollama:0.40.6
    container_name: service-brain-ollama
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
      OLLAMA_HOST: "0.0.0.0:11434"
      # 模型常驻，避免每次检索冷加载；并发与常驻模型数按 CPU/内存余量调整
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_MAX_LOADED_MODELS: "2"
    ports:
      # 仅绑回环：Ollama 无鉴权，不暴露到局域网；应用走内部网络按容器名访问
      # - "127.0.0.1:11434:11434"
      - "11434:11434"
    volumes:
      - ./volumes/ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app

  # 一次性拉取向量化模型：卷里已有则直接退出；失败时单独重跑本服务即可
  ollama-init:
    image: ollama/ollama:0.40.6
    container_name: service-brain-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://service-brain-ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull bge-m3"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    networks:
      - app

  # 一次性制备 rerank 模型：Q8_0 约 600MB，已存在则跳过下载
  rerank-init:
    image: curlimages/curl:latest
    container_name: service-brain-rerank-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -s "/models/bge-reranker-v2-m3-Q8_0.gguf" ]; then
          echo "rerank 模型已存在，跳过下载"
          exit 0
        fi
        echo "下载 rerank 模型 → /models/bge-reranker-v2-m3-Q8_0.gguf"
        curl -fL -C - --retry 3 --retry-delay 3 --create-dirs -o "/models/bge-reranker-v2-m3-Q8_0.gguf" \
          "https://hf-mirror.com/gpustack/bge-reranker-v2-m3-GGUF/resolve/main/bge-reranker-v2-m3-Q8_0.gguf"
    volumes:
      - ./volumes/rerank/models:/models
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    networks:
      - app

  # 重排序：llama-server --rerank 提供 /v1/rerank（Cohere/Jina 风格打分接口）
  # 镜像锁构建号：llama.cpp 无“稳定版”概念，只有逐次构建的 b<编号> tag，
  # 用 server-bXXXX 固定住二进制，比浮动的 :server 可复现（升级需人工验证后改号）
  rerank:
    image: ghcr.io/ggml-org/llama.cpp:server-b11889
    container_name: service-brain-rerank
    restart: unless-stopped
    depends_on:
      rerank-init:
        condition: service_completed_successfully
    environment:
      TZ: "Asia/Shanghai"
    command:
      - "--model"
      - "/models/bge-reranker-v2-m3-Q8_0.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      # 开启 rerank 端点（bge-reranker 系列 GGUF 才可用）
      - "--rerank"
      - "--ctx-size"
      - "8192"
      - "--threads"
      - "4"
    ports:
      # 仅绑回环：调试用，应用走内部网络按容器名访问
      # - "127.0.0.1:8080:8080"
      - "8080:8080"
    volumes:
      - ./volumes/rerank/models:/models:ro
    healthcheck:
      # 镜像内无 curl，用 bash 的 /dev/tcp 探活端口
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app

networks:
  app:
    name: "service-brain-agent"
    external: true
