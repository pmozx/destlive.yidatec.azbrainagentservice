# ==============================================================================
# 第三方公共服务编排（PostgreSQL + pgvector）—— 自建数据库时使用（可选）
#
#   与 devops/compose/app.yml 互补：app.yml 只起应用、不编排中间件；本文件把
#   PostgreSQL（镜像内置 pgvector 扩展）纳入同一外部共享网络 APP_NETWORK（默认
#   service-brain-agent），应用按容器名 service-brain-postgres 直连，无需对外发布端口。
#
#   应用配置仍唯一来源 env/.env.<ENVIRONMENT>：指向自建中间件只需改
#     DATABASE_TYPE=postgres
#     DATABASE_HOST=service-brain-postgres
#     DATABASE_PORT=5432
#     DATABASE_NAME=<与本文件 POSTGRES_DB 一致>
#   口令两边必须一致——本目录 .env 是 compose 插值文件（纯 KEY=value，已 gitignore），
#   负责容器初始化口令；env/.env.<env> 负责应用连接口令。口令严禁写入被跟踪文件。
#
#   向量能力：所选镜像自带 pgvector，initdb/00-init.sql 在数据目录首次初始化时
#   执行 CREATE EXTENSION IF NOT EXISTS vector；应用启动时还会幂等补建（配置项
#   VECTOR_AUTO_CREATE），因此数据卷已存在、跳过 initdb 的场景同样可用。
#
#   手工执行（compose 自动读取同目录 .env，缺失时先复制 .env.example 填实值）：
#     docker network create service-brain-agent   # 共享网络缺失时（部署脚本也会创建）
#     docker compose -f devops/common-server/docker-compose.yml up -d
#
#   数据持久化：宿主机 devops/common-server/volumes/postgres/data（已 gitignore，
#   首次启动自动创建）；发布端口仅绑 127.0.0.1 供本机运维工具连接。
#
#   本编排不入 CI：中间件是长寿命有状态服务，由部署机一次性拉起后长期运行，
#   与应用发布解耦（应用发布脚本不会触碰本编排）。
# ==============================================================================
name: service-brain-common

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    container_name: service-brain-postgres
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD（见同目录 .env.example，口令严禁入库）}"
      POSTGRES_DB: "${POSTGRES_DB:-service_brain_agent}"
    ports:
      # 仅绑回环：应用走内部网络无需发布；本机数据库工具经 127.0.0.1:<端口> 使用
      #- "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
      - "5432:5432"
    volumes:
      - ./volumes/postgres/data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    # 并行查询与向量索引构建会用到共享内存，默认 64MB 偏小
    shm_size: "256mb"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-service_brain_agent}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app

networks:
  app:
    name: "${APP_NETWORK:?APP_NETWORK 未设置（与应用共用的 docker 网络名，如 service-brain-agent）}"
    external: true
