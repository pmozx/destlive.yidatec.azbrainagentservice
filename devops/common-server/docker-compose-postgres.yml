# ==============================================================================
# PostgreSQL 17 + pgvector（自建数据库，独立编排）
#
#   公共中间件与模型服务按职责拆成三个独立编排，可分别启停、升级、备份：
#     docker-compose-postgres.yml   数据库（本文件）
#     docker-compose-minio.yml      对象存储 S3
#     docker-compose-agent.yml      向量化与重排序（模型推理）
#
#   三个编排都接入同一个外部共享网络 service-brain-agent，应用按容器名直连，
#   无需依赖对外发布端口：
#     service-brain-postgres  5432   PostgreSQL 17 + pgvector（宿主发布 39990）
#
#   应用配置仍唯一来源 env/.env.<ENVIRONMENT>：指向自建数据库只需改
#     DATABASE_TYPE=postgres
#     DATABASE_HOST=service-brain-postgres
#     DATABASE_PORT=5432            # 容器内按容器名直连，用服务端口 5432
#     DATABASE_NAME=service_brain
#     DATABASE_USER=postgres
#     DATABASE_PASSWORD=Yidatec@2026!
#   端口口径：39990 只是宿主机发布端口（同网段开发机/客户端直连用），容器内部
#   服务端口恒为 5432；容器内应用误填 39990 会连接被拒。
#   口令两边必须一致：本文件 POSTGRES_PASSWORD 与 env/.env.<env> 的
#   DATABASE_PASSWORD 必须是同一个值。取值已直接内联到本文件，因此本编排
#   无需 .env 即可 up -d；若希望口令不入库，把 POSTGRES_PASSWORD
#   改回 "${POSTGRES_PASSWORD:?}" 并在同目录 .env 提供实值。
#
#   向量能力：所选镜像自带 pgvector，initdb/00-init.sql 在数据目录首次初始化时
#   执行 CREATE EXTENSION IF NOT EXISTS vector；应用启动时还会幂等补建（配置项
#   VECTOR_AUTO_CREATE），因此数据卷已存在、跳过 initdb 的场景同样可用。
#   bge-m3 输出 1024 维，须与 env/.env.<env> 的 VECTOR_DIM 一致。
#
#   手工执行（本文件已内联全部取值，不需要 .env）：
#     docker network create service-brain-agent   # 共享网络缺失时（部署脚本也会创建）
#     docker compose -f devops/common-server/docker-compose-postgres.yml up -d
#
#   数据持久化：宿主机 devops/common-server/volumes/postgres/data（已 gitignore，
#   首次启动自动创建）；端口发布到所有网卡便于同网段直连。
#
#   本编排不入 CI：数据库是长寿命有状态服务，由部署机一次性拉起后长期
#   运行，与应用发布解耦（应用发布脚本不会触碰本编排）。
# ==============================================================================
name: service-brain-common-postgres

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    container_name: service-brain-postgres
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
      # 账号/口令/库名仅在数据目录为空（首次初始化）时生效：已有数据卷不会
      # 重新应用这三项，需用 SQL 手工改口令与建库，或清空 volumes/postgres/data 重建
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "Yidatec@2026!"
      POSTGRES_DB: "service_brain"
    ports:
      # 应用走内部网络无需发布；这里发布到所有网卡，便于同网段开发机直连
      # （如 env/.env.dev 的 DATABASE_HOST 填本机局域网 IP、DATABASE_PORT 填 39990）；
      # 宿主端口 39990，容器内仍是 5432；仅本机使用可改为 "127.0.0.1:39990:5432"
      - "39990:5432"
    volumes:
      - ./volumes/postgres/data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    # 并行查询与向量索引构建会用到共享内存，默认 64MB 偏小
    shm_size: "256mb"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d service_brain"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app

networks:
  app:
    name: "service-brain-agent"
    external: true
