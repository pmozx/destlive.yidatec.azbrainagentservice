# ==============================================================================
# MinIO（S3 兼容对象存储，独立编排）
#
#   公共中间件与模型服务按职责拆成三个独立编排，可分别启停、升级、备份：
#     docker-compose-postgres.yml   数据库
#     docker-compose-minio.yml      对象存储 S3（本文件）
#     docker-compose-agent.yml      向量化与重排序（模型推理）
#
#   容器名 service-brain-minio，接入外部共享网络 service-brain-agent：
#     service-brain-minio  9000   S3 API（宿主发布 39900）
#     service-brain-minio  9001   控制台（宿主发布 39901）
#
#   镜像锁 RELEASE：MinIO 无“稳定版”语义，只有逐次构建的 RELEASE.<时间戳> tag；
#   本 tag 与 Milvus 官方编排所用的同一构建，升级需人工验证后改 tag。注意镜像是
#   minio/minio（不是 milvusdb/minio），Milvus 官方 compose 引用的也是 minio/minio。
#
#   对象存储只负责提供 S3 服务，桶由应用启动时按 S3_AUTO_CREATE 幂等创建
#   （S3_BUCKET 默认 service-brain），与建向量表/审计表的策略一致；应用侧口径：
#     S3_ENDPOINT=http://service-brain-minio:9000   # 容器内按容器名直连
#     S3_ENDPOINT=http://<宿主机IP>:39900           # 宿主机进程直连用发布端口
#     S3_ACCESS_KEY / S3_SECRET_KEY / S3_BUCKET=service-brain
#   必须用 path-style 寻址（S3_ADDRESSING_STYLE=path），virtual 会把桶名解析成
#   子域名，内网没有对应 DNS 记录。
#
#   手工执行（本文件已内联全部取值，不需要 .env）：
#     docker network create service-brain-agent   # 共享网络缺失时（部署脚本也会创建）
#     docker compose -f devops/common-server/docker-compose-minio.yml up -d
#
#   数据持久化：宿主机 devops/common-server/volumes/minio/data（已 gitignore，
#   首次启动自动创建）；端口发布到所有网卡便于同网段直连。
#
#   本编排不入 CI：对象存储是长寿命有状态服务，由部署机一次性拉起后长期
#   运行，与应用发布解耦（应用发布脚本不会触碰本编排）。
# ==============================================================================
name: service-brain-common-minio

services:
  # 对象存储：MinIO（S3 兼容），文档原件与解析产物落这里
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: service-brain-minio
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
      # 根账号只用于创建桶与日常管理；应用侧应另建最小权限子账号，
      # 把 S3_ACCESS_KEY / S3_SECRET_KEY 填成子账号而非 root（本文件为联调便利先内联 root）
      MINIO_ROOT_USER: "service-brain"
      MINIO_ROOT_PASSWORD: "Yidatec@2026!"
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      # 宿主 39900 供本机/同网段进程直连 S3 API；容器内按容器名访问仍是 9000
      # S3 签名不加密，跨网段使用时请走内网或前置 HTTPS 反代
      - "39900:9000"
      - "39901:9001"
    volumes:
      - ./volumes/minio/data:/data
    healthcheck:
      # 镜像自带 mc；local 别名指向容器内 127.0.0.1:9000，凭据取自上面的 root 变量
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app

networks:
  app:
    name: "service-brain-agent"
    external: true
