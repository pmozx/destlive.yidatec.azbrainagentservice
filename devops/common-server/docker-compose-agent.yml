# ==============================================================================
# 模型推理服务（Ollama 向量化 + llama.cpp 重排序，独立编排）
#
#   公共中间件与模型服务按职责拆成三个独立编排，可分别启停、升级、备份：
#     docker-compose-postgres.yml   数据库
#     docker-compose-minio.yml      对象存储 S3
#     docker-compose-agent.yml      向量化与重排序（本文件）
#
#   两个模型服务常驻运行，接入外部共享网络 service-brain-agent，应用按容器名直连：
#     service-brain-ollama    11434  向量化：/api/embed，模型 bge-m3（1024 维）
#     service-brain-rerank    8001   重排序：/v1/rerank，模型 bge-reranker-v2-m3
#
#   为什么 rerank 不用 Ollama：Ollama 只提供 embed 端点，没有 rerank（交叉编码器
#   打分）接口，社区 reranker 模型也注明需 llama.cpp 类运行时；因此重排序交给
#   llama.cpp 的 llama-server --rerank，两者跑的都是本地 GGUF，无需出网推理。
#
#   首次启动自动制备模型：ollama-init 拉取 bge-m3，rerank-init 下载 rerank GGUF
#   到 volumes/rerank/models（已存在则跳过）。二者都是一次性容器，失败时单独
#   重跑即可，不影响已就绪的模型服务：
#     docker compose -f devops/common-server/docker-compose-agent.yml up -d ollama-init
#   镜像 + 模型合计约 5GB 磁盘；CPU 推理常驻内存约 3GB，离线小批量场景足够。
#
#   手工执行（本文件已内联全部取值，不需要 .env）：
#     docker network create service-brain-agent   # 共享网络缺失时（部署脚本也会创建）
#     docker compose -f devops/common-server/docker-compose-agent.yml up -d
#
#   数据持久化：宿主机 devops/common-server/volumes/{ollama,rerank/models}
#   （已 gitignore，首次启动自动创建）；两个服务的发布端口仅作调试用。
#
#   本编排不入 CI：模型服务是长寿命服务，由部署机一次性拉起后长期运行，
#   与应用发布解耦（应用发布脚本不会触碰本编排）。
# ==============================================================================
name: service-brain-common-agent

services:
  # 向量化：bge-m3（多语言，1024 维，8K 上下文），走 Ollama 原生 /api/embed
  # 镜像锁版本：ollama/ollama:0.40.6（已验证可用的稳定版，0.40.x 为当前稳定线）
  ollama:
    image: ollama/ollama:0.40.6
    container_name: service-brain-ollama
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
      OLLAMA_HOST: "0.0.0.0:11434"
      # 模型常驻，避免每次检索冷加载；并发与常驻模型数按 CPU/内存余量调整
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_MAX_LOADED_MODELS: "2"
    ports:
      # Ollama 无鉴权：这里发布到所有网卡方便同网段调试；只本机使用请换回
      # "127.0.0.1:11434:11434"，应用走内部网络按容器名访问，不依赖此端口
      - "11434:11434"
    volumes:
      - ./volumes/ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app

  # 一次性拉取向量化模型：卷里已有则直接退出；失败时单独重跑本服务即可
  ollama-init:
    image: ollama/ollama:0.40.6
    container_name: service-brain-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://service-brain-ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull bge-m3"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    networks:
      - app

  # 一次性制备 rerank 模型：Q8_0 约 600MB，已存在则跳过下载
  rerank-init:
    image: curlimages/curl:latest
    container_name: service-brain-rerank-init
    restart: "no"
    # curlimages/curl 以非 root 的 curl_user 运行。当 bind 源目录尚不存在时，Docker 挂进
    # 来的是 root 所有的空目录，curl 写不进去（报 curl: (23) ... Permission denied）。
    # 这里显式以 root 执行，允许它在该目录下创建模型文件（仅一次性下载，无其他风险）
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -s "/models/bge-reranker-v2-m3-Q8_0.gguf" ]; then
          echo "rerank 模型已存在，跳过下载"
          exit 0
        fi
        echo "下载 rerank 模型 → /models/bge-reranker-v2-m3-Q8_0.gguf"
        curl -fL -C - --retry 3 --retry-delay 3 --create-dirs -o "/models/bge-reranker-v2-m3-Q8_0.gguf" \
          "https://hf-mirror.com/gpustack/bge-reranker-v2-m3-GGUF/resolve/main/bge-reranker-v2-m3-Q8_0.gguf"
    volumes:
      - ./volumes/rerank/models:/models
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    networks:
      - app

  # 重排序：llama-server --rerank 提供 /v1/rerank（Cohere/Jina 风格打分接口）
  # 镜像锁构建号：llama.cpp 无“稳定版”概念，只有逐次构建的 b<编号> tag，
  # 用 server-bXXXX 固定住二进制，比浮动的 :server 可复现（升级需人工验证后改号）
  rerank:
    image: ghcr.io/ggml-org/llama.cpp:server-b11889
    container_name: service-brain-rerank
    restart: unless-stopped
    depends_on:
      rerank-init:
        condition: service_completed_successfully
    environment:
      TZ: "Asia/Shanghai"
    command:
      - "--model"
      - "/models/bge-reranker-v2-m3-Q8_0.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8001"
      # 开启 rerank 端点（bge-reranker 系列 GGUF 才可用）
      - "--rerank"
      - "--ctx-size"
      - "8192"
      # 物理批（ubatch）是单条 rerank 输入的硬上限，默认仅 512 token：分片按字符
      # 计数（PARSE_CHUNK_SIZE=800，中文约 800 token），一超过就整请求 500
      # （input is too large to process）。这里抬到 2048，须同时抬逻辑批，
      # 否则 llama-server 会把 ubatch 钳回 batch-size 的值。若日后调大
      # PARSE_CHUNK_SIZE，需同步复核这两项
      - "--batch-size"
      - "2048"
      - "--ubatch-size"
      - "2048"
      - "--threads"
      - "4"
    ports:
      # 仅作调试用，应用走内部网络按容器名访问（容器内监听 8001，宿主机映射 8001）
      # - "127.0.0.1:8001:8001"
      - "8001:8001"
    volumes:
      - ./volumes/rerank/models:/models:ro
    healthcheck:
      # 镜像内无 curl，用 bash 的 /dev/tcp 探活端口
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8001' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app

networks:
  app:
    name: "service-brain-agent"
    external: true
